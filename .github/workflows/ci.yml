name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    name: typecheck, unit tests and sql dist
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - name: sql/dist is up to date
        run: bun run sql:build && git diff --exit-code -- sql/dist

  examples:
    name: examples compile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: nestjs
        run: bunx tsc --noEmit -p examples/nestjs
      - name: elysia
        run: bunx tsc --noEmit -p examples/elysia
      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache: false
      - run: cd examples/go && go vet ./... && go build -o /dev/null .
      - run: python3 -m py_compile examples/python/example.py
      - run: php -l examples/php/example.php
      - run: ruby -c examples/ruby/example.rb
      - name: java
        run: mvn -q -B -f examples/java/pom.xml compile
      - name: csharp
        run: dotnet build examples/csharp -c Release --nologo -v q

  database:
    name: migrations, seeds, pgTAP and HTTP conformance
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest
      - name: start the local stack (database, auth, PostgREST)
        run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: pgTAP
        run: supabase test db
      - name: HTTP conformance through PostgREST
        run: |
          eval "$(supabase status -o env)"
          export SUPABASE_URL="${API_URL:-http://127.0.0.1:54321}"
          export SUPABASE_ANON_KEY="${ANON_KEY:-${PUBLISHABLE_KEY:-}}"
          export SUPABASE_SERVICE_ROLE_KEY="${SERVICE_ROLE_KEY:-${SECRET_KEY:-}}"
          bash tests/http/conformance.sh
